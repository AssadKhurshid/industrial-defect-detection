[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-defect-detection"
version = "0.1.0"
description = "Surface defect detection on MVTec AD: OpenCV baseline vs deep model, ONNX on CPU, FastAPI + Docker"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python-headless"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "torch", "torchvision", "onnx", "onnxscript", "onnxruntime", "fastapi", "python-multipart", "httpx"]
deep = ["torch", "torchvision", "onnx", "onnxscript", "onnxruntime"]
api = ["fastapi", "python-multipart", "uvicorn", "onnxruntime"]

[tool.setuptools.packages.find]
where = ["src"]
